name: Release

# Push a tag such as v0.1.0 (matching the version in Cargo.toml) to build
# per-arch archives and attach them plus the bootstrap installer to a draft
# release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - id: package
        run: |
          archive=$(scripts/package.sh | tail -1)
          test -f "$archive" || { echo "Archive not produced: $archive" >&2; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-x86_64
          path: ${{ steps.package.outputs.archive }}

  package-aarch64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - id: package
        run: |
          archive=$(scripts/package.sh | tail -1)
          test -f "$archive" || { echo "Archive not produced: $archive" >&2; exit 1; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-aarch64
          path: ${{ steps.package.outputs.archive }}

  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Setup user flatpak
        run: |
          # The runner user is non-root and has no polkit agent, so system
          # flatpak operations are not allowed. Use --user instead.
          mkdir -p ~/.local/share/flatpak
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install GNOME runtime and SDK
        run: |
          flatpak --user install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean build-dir packaging/flatpak/com.tabletcenter.TabletCenter.yml
      - name: Create bundle
        run: |
          flatpak build-export --user repo build-dir
          flatpak build-bundle --user repo com.tabletcenter.TabletCenter.flatpak com.tabletcenter.TabletCenter
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: com.tabletcenter.TabletCenter.flatpak

  release:
    needs: [package-x86_64, package-aarch64, flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: .
      - name: Build bootstrap installer
        run: |
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/install"
          cp -r install.sh uninstall.sh packaging gnome-extension LICENSE README.md "$tmpdir/install/"
          tar -C "$tmpdir" -czf dist/install.sh.tar.gz install
          rm -rf "$tmpdir"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/tablet-center-x86_64-linux.tar.gz
            dist/tablet-center-aarch64-linux.tar.gz
            dist/install.sh.tar.gz
            com.tabletcenter.TabletCenter.flatpak