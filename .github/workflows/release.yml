  flatpak:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup user flatpak
        run: |
          mkdir -p ~/.local/share/flatpak
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          flatpak --user install -y flathub org.gnome.Platform//51 org.gnome.Sdk//51 org.freedesktop.Sdk.Extension.rust-stable//23.08

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean build-dir packaging/flatpak/com.tabletcenter.TabletCenter.yml

      - name: Create bundle
        run: |
          flatpak build-export --user repo build-dir
          flatpak build-bundle --user repo com.tabletcenter.TabletCenter.flatpak com.tabletcenter.TabletCenter

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: com.tabletcenter.TabletCenter.flatpak
