name: Release

# Push a tag such as v0.1.0 (matching the version in Cargo.toml) to build
# per-arch archives and attach them plus the bootstrap installer to a draft
# release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    # The oldest supported runner, so the binaries run on older glibc too.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - name: Install cross toolchain (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - id: package
        run: |
          case "${{ matrix.arch }}" in
            aarch64) archive=$(scripts/package.sh --target aarch64-unknown-linux-gnu | tail -1) ;;
            *)       archive=$(scripts/package.sh x86_64 | tail -1) ;;
          esac
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}

  release:
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build bootstrap installer
        run: |
          tmpdir=$(mktemp -d)
          mkdir -p "$tmpdir/install"
          cp install.sh uninstall.sh packaging gnome-extension LICENSE README.md "$tmpdir/install/"
          tar -C "$tmpdir" -czf dist/install.sh.tar.gz install
          rm -rf "$tmpdir"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/tablet-center-x86_64-linux.tar.gz
            dist/tablet-center-aarch64-linux.tar.gz
            dist/install.sh.tar.gz
