[workspace]
resolver = "2"
members = ["crates/tablet-config", "crates/tabletforged", "crates/tabletforge"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tablet-config = { path = "crates/tablet-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
