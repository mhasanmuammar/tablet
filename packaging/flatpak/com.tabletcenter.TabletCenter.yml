app-id: com.tabletcenter.TabletCenter
default-branch: stable
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tablet-center
finish-args:
  - --device=all
  - --filesystem=xdg-config
  - --filesystem=xdg-data
  - --filesystem=xdg-run
  - --socket=wayland
  - --socket=session-bus
  - --talk-name=org.gnome.Shell
  - --talk-name=org.freedesktop.Flatpak
  - --share=network
  - --share=ipc
modules:
  - name: tablet-center
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/tablet-center/.cargo
      build-args:
        - --share=network
    build-commands:
      - cargo build --release -p tabletd -p tablet-center
      - install -Dm755 target/release/tabletd /app/bin/tabletd
      - install -Dm755 target/release/tablet-center /app/bin/tablet-center
      - install -Dm644 packaging/flatpak/com.tabletcenter.TabletCenter.desktop /app/share/applications/com.tabletcenter.TabletCenter.desktop
      - install -Dm644 packaging/flatpak/com.tabletcenter.TabletCenter.metainfo.xml /app/share/metainfo/com.tabletcenter.TabletCenter.metainfo.xml
      - install -Dm644 packaging/icons/tablet-center-512.png /app/share/icons/hicolor/512x512/apps/com.tabletcenter.TabletCenter.png
      - install -Dm644 packaging/icons/tablet-center-256.png /app/share/icons/hicolor/256x256/apps/com.tabletcenter.TabletCenter.png
      - install -Dm644 packaging/icons/tablet-center-128.png /app/share/icons/hicolor/128x128/apps/com.tabletcenter.TabletCenter.png
      - install -Dm644 packaging/icons/tablet-center-64.png /app/share/icons/hicolor/64x64/apps/com.tabletcenter.TabletCenter.png
      - install -Dm644 packaging/icons/tablet-center-48.png /app/share/icons/hicolor/48x48/apps/com.tabletcenter.TabletCenter.png
      - install -Dm644 gnome-extension/tablet-center@tabletcenter.dev/extension.js /app/share/gnome-shell/extensions/tablet-center@tabletcenter.dev/extension.js
      - install -Dm644 gnome-extension/tablet-center@tabletcenter.dev/metadata.json /app/share/gnome-shell/extensions/tablet-center@tabletcenter.dev/metadata.json
      - install -Dm644 gnome-extension/tablet-center@tabletcenter.dev/menus.js /app/share/gnome-shell/extensions/tablet-center@tabletcenter.dev/menus.js
      - install -Dm644 gnome-extension/tablet-center@tabletcenter.dev/stylesheet.css /app/share/gnome-shell/extensions/tablet-center@tabletcenter.dev/stylesheet.css
      - install -Dm644 packaging/70-tablet-center.rules /app/share/udev/rules.d/70-tablet-center.rules
      - install -Dm644 packaging/tabletd.service /app/share/systemd/user/tabletd.service
    sources:
      - type: dir
        path: ../..
